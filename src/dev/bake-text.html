<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>asemic — bake text (단어·문단 세로 긴 PNG)</title>
        <style>
            /* 단어·문단을 한 줄 N자로 접어 mycelium으로 키우고, 줄이 쌓이면 웹툰처럼 아래로 스크롤.
               저장 PNG는 가로 고정 · 세로는 줄 수만큼 늘어난다.
               npm run dev 에서만 저장된다 — vite.config.js의 /__bake 미들웨어.
               체커보드(또는 ?bg=)는 보기용 배경일 뿐 PNG에는 안 들어간다. */
            html,
            body {
                margin: 0;
                min-height: 100%;
                background: var(--bg, repeating-conic-gradient(#555 0 25%, #666 0 50%) 0 0 / 32px 32px);
                background-attachment: fixed;
                font: 13px/1.5 ui-monospace, Menlo, monospace;
                color: #eee;
                overflow-x: hidden;
            }
            /* 줄 띠(strip)가 쌓이는 종이. 높이는 bake-text.js가 줄 수에 맞춰 늘린다 */
            #paper {
                position: relative;
                width: 100%;
                height: 100vh;
            }
            #paper canvas {
                position: absolute;
                left: 0;
                width: 100%;
            }
            #panel {
                position: fixed;
                top: 12px;
                left: 12px;
                z-index: 10;
                width: 300px;
                padding: 12px;
                background: rgba(0, 0, 0, 0.75);
                border-radius: 8px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            #panel.folded > :not(#fold) {
                display: none;
            }
            #panel.folded {
                width: auto;
            }
            #panel textarea {
                height: 140px;
                resize: vertical;
                font: inherit;
            }
            #panel label {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                align-items: center;
            }
            #panel input[type='number'] {
                width: 80px;
            }
            #panel button {
                padding: 6px;
                font: inherit;
            }
            #status {
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <div id="paper"></div>
        <div id="panel">
            <button id="fold">패널 접기</button>
            <textarea
                id="text"
                spellcheck="false"
                placeholder="줄바꿈 = 강제 줄바꿈&#10;--- 만 있는 줄 = 다음 이미지로 나눔"
            ></textarea>
            <label>한 줄 최대 음절<input id="perLine" type="number" min="1" step="1" /></label>
            <label>출력 가로(px, 0=원본)<input id="width" type="number" min="0" step="1" /></label>
            <label>줄 간격(× 글자 크기)<input id="lh" type="number" min="0.5" step="0.1" /></label>
            <label>폴더 (bake/…)<input id="dir" type="text" size="12" /></label>
            <label><span>성장 생략(instant)</span><input id="instant" type="checkbox" /></label>
            <label><span>PNG 저장</span><input id="save" type="checkbox" checked /></label>
            <button id="go">굽기</button>
            <div id="status">준비 중…</div>
        </div>
        <script type="module" src="./bake-text.js"></script>
    </body>
</html>
