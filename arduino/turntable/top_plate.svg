<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="320mm" viewBox="0 0 320 320" fill="none" stroke-width="0.1">
  <!-- 턴테이블 윗판 Ø300 — 레이저 1:1. 0° = 위 = 센서 쪽. 아랫면 표시(초록)는 세로축 대칭이라 좌우로 뒤집어 새기면 된다. 아크릴은 흰색 불투명(투명이면 센서가 못 읽음)
       make_plates.py로 생성 — 손으로 고치지 말 것 -->
  <g id="cut" stroke="#FF0000">
    <circle cx="160" cy="160" r="150"/>  <!-- 윗판 Ø300 -->
    <circle cx="160" cy="149.5" r="1.7"/>  <!-- 커플러 4-Ø3.4 (M3) -->
    <circle cx="170.5" cy="160" r="1.7"/>  <!-- 커플러 4-Ø3.4 (M3) -->
    <circle cx="160" cy="170.5" r="1.7"/>  <!-- 커플러 4-Ø3.4 (M3) -->
    <circle cx="149.5" cy="160" r="1.7"/>  <!-- 커플러 4-Ø3.4 (M3) -->
  </g>
  <g id="engrave-top" stroke="#0000FF">
    <path d="M160 24 L160 14"/>  <!-- 사물 자리 0° -->
    <path d="M296 160 L306 160"/>  <!-- 사물 자리 90° -->
    <path d="M160 296 L160 306"/>  <!-- 사물 자리 180° -->
    <path d="M24 160 L14 160"/>  <!-- 사물 자리 270° -->
    <path d="M160 30 L154.375 36.128 L165.625 36.128 Z"/>  <!-- 0번 = mycelium = 넓은 테이프, 센서 쪽 -->
    <circle cx="160" cy="160" r="14"/>  <!-- 커플러 플랜지 자리(아랫면에 붙음) -->
  </g>
  <g id="engrave-bottom" stroke="#00FF00">
    <circle cx="160" cy="160" r="101"/>  <!-- 레이지수잔 바깥 -->
    <circle cx="160" cy="160" r="72.5"/>  <!-- 레이지수잔 안쪽 -->
    <path d="M133.5 114.101 L130.5 108.905"/>  <!-- 넓은 테이프 시작 -->
    <path d="M160 107 L160 101"/>  <!-- 넓은 테이프 가운데 -->
    <path d="M186.5 114.101 L189.5 108.905"/>  <!-- 넓은 테이프 끝 -->
    <path d="M212.625 153.705 L218.582 152.993"/>  <!-- 좁은 테이프 90° 시작 -->
    <path d="M212.625 166.295 L218.582 167.007"/>  <!-- 좁은 테이프 90° 끝 -->
    <path d="M166.295 212.625 L167.007 218.582"/>  <!-- 좁은 테이프 180° 시작 -->
    <path d="M153.705 212.625 L152.993 218.582"/>  <!-- 좁은 테이프 180° 끝 -->
    <path d="M107.375 166.295 L101.418 167.007"/>  <!-- 좁은 테이프 270° 시작 -->
    <path d="M107.375 153.705 L101.418 152.993"/>  <!-- 좁은 테이프 270° 끝 -->
  </g>
</svg>
