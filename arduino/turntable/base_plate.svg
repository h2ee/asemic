    <circle cx="355" cy="295" r="3.25"/>  <!-- 프레임 고정 M6 — 프로파일 위치 확인 후 -->
    <circle cx="190" cy="160" r="11.5"/>  <!-- 모터 보스 Ø22 + 축 -->
    <circle cx="174.5" cy="144.5" r="1.7"/>  <!-- 모터 M3 (31 간격) -->
    <circle cx="174.5" cy="175.5" r="1.7"/>  <!-- 모터 M3 (31 간격) -->
    <circle cx="205.5" cy="144.5" r="1.7"/>  <!-- 모터 M3 (31 간격) -->
    <circle cx="205.5" cy="175.5" r="1.7"/>  <!-- 모터 M3 (31 간격) -->
    <g transform="rotate(-0 190 202)">
